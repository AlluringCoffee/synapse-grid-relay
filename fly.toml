# Fly.io app config for the Synapse Grid relay.
# `fly launch` (run from this server/ directory) may offer to generate/overwrite
# this; keep internal_port = 8080 so it matches the server's default PORT.
# You must run `fly auth login` and accept Fly's ToS yourself.

app = "synapse-grid-relay"   # change to a unique name; `fly launch` can pick one
primary_region = "iad"        # pick a region near your players

[build]

[env]
  PORT = "8080"
  # Must match the client's seat cap (network_manager.gd MAX_ENET_PEERS = 12, seat_target clamped
  # to 12) and signaling_server.js's own default of 12. This env var overrides that default, so a
  # smaller value here does not shrink the lobby - the client still offers 12 seats and the relay
  # rejects the extras with `room_full`. Was "4"; see server/render.yaml for the full rationale.
  MAX_ROOM_SIZE = "12"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true    # set false (paid) to keep it always-on, no wake delay
  auto_start_machines = true
  min_machines_running = 0     # raise to 1 (paid) for instant first connection

[[http_service.checks]]
  method = "GET"
  path = "/health"
  interval = "30s"
  timeout = "5s"
