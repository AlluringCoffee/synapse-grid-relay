# Render Blueprint for the Synapse Grid relay.
# In Render: New + -> Blueprint -> point at this repo. Render reads this file.
# You must create/log in to the Render account and accept their ToS yourself.
services:
  - type: web
    name: synapse-grid-relay
    runtime: node
    rootDir: server
    plan: free            # change to "starter" (paid) to avoid free-tier sleep
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    # Render injects PORT automatically; the server reads process.env.PORT.
    envVars:
      # MUST match the client's seat cap. network_manager.gd pins MAX_ENET_PEERS = 12 and clamps
      # seat_target to 12; signaling_server.js defaults to 12 for the same reason (10 arena + 2
      # spectator headroom). This env var OVERRIDES that default, so a lower number here does not
      # shrink the lobby - it lets the client offer seats the relay then refuses with `room_full`,
      # which surfaces to the player as an unexplained join failure. It sat at "4" and would have
      # capped every deployed room at 4 while the UI advertised 12. If free-tier capacity ever
      # forces a smaller room, lower the CLIENT cap in the same change or the two disagree again.
      - key: MAX_ROOM_SIZE
        value: "12"
